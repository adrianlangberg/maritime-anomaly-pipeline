<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="100%" height="100%" fill="#0B1F33"/><style>text{font-family:Segoe UI,Arial,sans-serif}</style><text x="60" y="65" fill="#F7FAFC" font-size="34" font-weight="700" text-anchor="start">Detector evidence ceilings</text><text x="60" y="105" fill="#56CCF2" font-size="20" font-weight="400" text-anchor="start">Story: only Signal Gap can cross the P1 behavior threshold in model v1.0.</text><line x1="1028.0" y1="140" x2="1028.0" y2="585" stroke="#F2C94C" stroke-width="3" stroke-dasharray="10 8"/><text x="1020.0" y="145" fill="#F2C94C" font-size="16" font-weight="700" text-anchor="end">P1 threshold = 90</text><text x="270" y="194" fill="#F7FAFC" font-size="18" font-weight="600" text-anchor="end">Speed inconsistency</text><rect x="290" y="170" width="820" height="32" rx="5" fill="#132B42"/><rect x="290" y="170" width="123.0" height="32" rx="5" fill="#2F80ED"/><text x="425.0" y="194" fill="#F7FAFC" font-size="18" font-weight="700" text-anchor="start">15</text><text x="270" y="272" fill="#F7FAFC" font-size="18" font-weight="600" text-anchor="end">Identity inconsistency</text><rect x="290" y="248" width="820" height="32" rx="5" fill="#132B42"/><rect x="290" y="248" width="123.0" height="32" rx="5" fill="#2F80ED"/><text x="425.0" y="272" fill="#F7FAFC" font-size="18" font-weight="700" text-anchor="start">15</text><text x="270" y="350" fill="#F7FAFC" font-size="18" font-weight="600" text-anchor="end">Loitering</text><rect x="290" y="326" width="820" height="32" rx="5" fill="#132B42"/><rect x="290" y="326" width="590.4" height="32" rx="5" fill="#2F80ED"/><text x="892.4" y="350" fill="#F7FAFC" font-size="18" font-weight="700" text-anchor="start">72</text><text x="270" y="428" fill="#F7FAFC" font-size="18" font-weight="600" text-anchor="end">Unusual port behavior</text><rect x="290" y="404" width="820" height="32" rx="5" fill="#132B42"/><rect x="290" y="404" width="606.8" height="32" rx="5" fill="#2F80ED"/><text x="908.8" y="428" fill="#F7FAFC" font-size="18" font-weight="700" text-anchor="start">74</text><text x="270" y="506" fill="#F7FAFC" font-size="18" font-weight="600" text-anchor="end">Signal gap</text><rect x="290" y="482" width="820" height="32" rx="5" fill="#132B42"/><rect x="290" y="482" width="820.0" height="32" rx="5" fill="#27AE60"/><text x="1122.0" y="506" fill="#F7FAFC" font-size="18" font-weight="700" text-anchor="start">100</text><text x="60" y="625" fill="#8FA4B8" font-size="18" font-weight="400" text-anchor="start">Interpretation: a high tier is structurally possible only when the detector can supply enough evidence.</text></svg>