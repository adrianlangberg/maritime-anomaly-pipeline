<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="700" viewBox="0 0 1250 700"><rect width="100%" height="100%" fill="#0B1F33"/><style>text{font-family:Segoe UI,Arial,sans-serif}</style><text x="60" y="65" fill="#F7FAFC" font-size="34" font-weight="700" text-anchor="start">What adds behavior evidence to a Signal Gap?</text><text x="60" y="105" fill="#56CCF2" font-size="19" font-weight="400" text-anchor="start">Story: open-water context is common, but movement, plausible speed, and speed agreement make a gap review-worthy.</text><text x="370" y="194" fill="#F7FAFC" font-size="18" font-weight="600" text-anchor="end">Time-connected behavioral support</text><rect x="390" y="170" width="700" height="32" rx="5" fill="#132B42"/><rect x="390" y="170" width="58.134243458475545" height="32" rx="5" fill="#2F80ED"/><text x="460.13424345847557" y="193" fill="#F7FAFC" font-size="17" font-weight="700" text-anchor="start">avg +1.2 pts</text><text x="1110" y="193" fill="#8FA4B8" font-size="16" font-weight="400" text-anchor="start">affects 23.5%</text><text x="370" y="266" fill="#F7FAFC" font-size="18" font-weight="600" text-anchor="end">Implied travel speed</text><rect x="390" y="242" width="700" height="32" rx="5" fill="#132B42"/><rect x="390" y="242" width="356.76905574516496" height="32" rx="5" fill="#2F80ED"/><text x="734.7690557451649" y="265" fill="#F7FAFC" font-size="17" font-weight="700" text-anchor="end">avg +7.2 pts</text><text x="1110" y="265" fill="#8FA4B8" font-size="16" font-weight="400" text-anchor="start">affects 56.6%</text><text x="370" y="338" fill="#F7FAFC" font-size="18" font-weight="600" text-anchor="end">Gap duration</text><rect x="390" y="314" width="700" height="32" rx="5" fill="#132B42"/><rect x="390" y="314" width="401.05333333333334" height="32" rx="5" fill="#2F80ED"/><text x="779.0533333333333" y="337" fill="#F7FAFC" font-size="17" font-weight="700" text-anchor="end">avg +8.1 pts</text><text x="1110" y="337" fill="#8FA4B8" font-size="16" font-weight="400" text-anchor="start">affects 100.0%</text><text x="370" y="410" fill="#F7FAFC" font-size="18" font-weight="600" text-anchor="end">Speed agreement</text><rect x="390" y="386" width="700" height="32" rx="5" fill="#132B42"/><rect x="390" y="386" width="414.1069397042093" height="32" rx="5" fill="#2F80ED"/><text x="792.1069397042093" y="409" fill="#F7FAFC" font-size="17" font-weight="700" text-anchor="end">avg +8.4 pts</text><text x="1110" y="409" fill="#8FA4B8" font-size="16" font-weight="400" text-anchor="start">affects 92.3%</text><text x="370" y="482" fill="#F7FAFC" font-size="18" font-weight="600" text-anchor="end">Endpoint movement</text><rect x="390" y="458" width="700" height="32" rx="5" fill="#132B42"/><rect x="390" y="458" width="484.17096700796384" height="32" rx="5" fill="#2F80ED"/><text x="862.1709670079638" y="481" fill="#F7FAFC" font-size="17" font-weight="700" text-anchor="end">avg +9.8 pts</text><text x="1110" y="481" fill="#8FA4B8" font-size="16" font-weight="400" text-anchor="start">affects 86.2%</text><text x="370" y="554" fill="#F7FAFC" font-size="18" font-weight="600" text-anchor="end">Endpoint context</text><rect x="390" y="530" width="700" height="32" rx="5" fill="#132B42"/><rect x="390" y="530" width="699.9999999999999" height="32" rx="5" fill="#2F80ED"/><text x="1078.0" y="553" fill="#F7FAFC" font-size="17" font-weight="700" text-anchor="end">avg +14.1 pts</text><text x="1110" y="553" fill="#8FA4B8" font-size="16" font-weight="400" text-anchor="start">affects 100.0%</text><text x="60" y="655" fill="#8FA4B8" font-size="17" font-weight="400" text-anchor="start">Average points are calculated across all 311 Signal Gap events; the percentage shows how often each factor changed a score.</text></svg>