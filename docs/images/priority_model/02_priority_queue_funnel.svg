<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="100%" height="100%" fill="#0B1F33"/><style>text{font-family:Segoe UI,Arial,sans-serif}</style><text x="60" y="65" fill="#F7FAFC" font-size="34" font-weight="700" text-anchor="start">From 3,367 detector flags to a review queue</text><text x="60" y="105" fill="#56CCF2" font-size="19" font-weight="400" text-anchor="start">Story: scoring creates scarcity—20 P1 events receive immediate review, while 200 unreliable events route to DQ.</text><text x="220" y="190" fill="#F7FAFC" font-size="22" font-weight="700" text-anchor="end">P1</text><rect x="240" y="165" width="840" height="36" rx="5" fill="#132B42"/><rect x="240" y="165" width="10.225197808886184" height="36" rx="5" fill="#EB5757"/><text x="262.22519780888615" y="191" fill="#F7FAFC" font-size="19" font-weight="700" text-anchor="start">20</text><text x="220" y="266" fill="#F7FAFC" font-size="22" font-weight="700" text-anchor="end">P2</text><rect x="240" y="241" width="840" height="36" rx="5" fill="#132B42"/><rect x="240" y="241" width="25.05173463177115" height="36" rx="5" fill="#F2C94C"/><text x="277.0517346317711" y="267" fill="#F7FAFC" font-size="19" font-weight="700" text-anchor="start">49</text><text x="220" y="342" fill="#F7FAFC" font-size="22" font-weight="700" text-anchor="end">P3</text><rect x="240" y="317" width="840" height="36" rx="5" fill="#132B42"/><rect x="240" y="317" width="840.0" height="36" rx="5" fill="#2F80ED"/><text x="1092.0" y="343" fill="#F7FAFC" font-size="19" font-weight="700" text-anchor="start">1,643</text><text x="220" y="418" fill="#F7FAFC" font-size="22" font-weight="700" text-anchor="end">DQ</text><rect x="240" y="393" width="840" height="36" rx="5" fill="#132B42"/><rect x="240" y="393" width="102.25197808886183" height="36" rx="5" fill="#9B51E0"/><text x="354.25197808886185" y="419" fill="#F7FAFC" font-size="19" font-weight="700" text-anchor="start">200</text><text x="220" y="494" fill="#F7FAFC" font-size="22" font-weight="700" text-anchor="end">Routine</text><rect x="240" y="469" width="840" height="36" rx="5" fill="#132B42"/><rect x="240" y="469" width="743.8831405964698" height="36" rx="5" fill="#8FA4B8"/><text x="995.8831405964698" y="495" fill="#F7FAFC" font-size="19" font-weight="700" text-anchor="start">1,455</text><text x="60" y="610" fill="#8FA4B8" font-size="18" font-weight="400" text-anchor="start">The model prioritizes review; it does not predict intent or wrongdoing.</text></svg>